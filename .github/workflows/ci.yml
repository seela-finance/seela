name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: seela-app

jobs:
  check:
    name: Typecheck · Lint · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # Supabase de STAGING uniquement. Sans secrets, les tests publics tournent
      # quand même (l'auth échoue proprement → redirection /auth).
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY || 'ci-dummy-key' }}
      # Compte de test staging : active les tests du projet "authenticated" s'il est défini.
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      # Clé service role de STAGING : active les parcours connectés (e2e/flows/), avec des comptes
      # éphémères. e2e/support/staging.ts refuse toute autre base que le staging.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_STAGING: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: seela-app/.nvmrc
          cache: npm
          cache-dependency-path: seela-app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-parcours
          path: seela-app/test-results/screens
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            seela-app/playwright-report
            seela-app/test-results
          retention-days: 7
